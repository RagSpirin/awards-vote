<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리끼리 어워즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one full-viewport stage at a time — intro → roster grid (6×3) with HUD above and a result band below → finale.
   Operator-only settings live in an overlay (S key / gear) so the TV never shows them. Single dark "award show" look. */
:root{
  --bg:#0b0a1f;
  --glow-1:rgba(124,92,255,.38);
  --glow-2:rgba(255,79,154,.2);
  --surface:rgba(255,255,255,.055);
  --surface-2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.13);
  --fg:#f6f3ff;
  --fg-muted:rgba(246,243,255,.6);
  --accent:#ff4f9a;
  --accent-2:#7c5cff;
  --gold:#ffd166;
  --gold-deep:#f0a92a;
  --danger:#ff7a7a;
  --ok:#4de1c1;
  --font-display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --pad:clamp(14px,2.4vh,28px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 70% 55% at 50% -12%,var(--glow-1),transparent 62%),radial-gradient(ellipse 45% 40% at 92% 104%,var(--glow-2),transparent 60%)}
button,input,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;gap:clamp(10px,1.8vh,22px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + var(--pad)) calc(env(safe-area-inset-bottom,0px) + var(--pad))}
.screen.is-active{display:flex}

/* ---------- intro / finale ---------- */
#s-intro,#s-end{align-items:center;justify-content:center;text-align:center}
.intro{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vh,28px);max-width:860px}
.eyebrow{margin:0;font-size:clamp(12px,1.1vw,15px);font-weight:700;letter-spacing:.22em;color:var(--accent)}
.title{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(56px,10vw,136px);line-height:.98;letter-spacing:-.01em;text-wrap:balance;
  background:linear-gradient(180deg,#fff 30%,#cbbcff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;color:var(--fg-muted);line-height:1.7;font-size:clamp(14px,1.5vw,19px);text-wrap:balance}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.keys{margin:10px 0 0;color:var(--fg-muted);font-size:13px;letter-spacing:.04em}
.keys.is-hidden{visibility:hidden}
kbd{font-family:var(--font-body);font-weight:700;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.data-status{margin:0;font-size:12px;letter-spacing:.06em;color:var(--fg-muted);display:flex;align-items:center;gap:8px}
.data-status i{width:8px;height:8px;border-radius:50%;background:var(--fg-muted)}
.data-status.is-live i{background:var(--ok)}
.data-status.is-sample i{background:var(--gold)}

.btn{font-weight:700;padding:13px 24px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;
  transition:transform .15s,background .15s,opacity .15s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;box-shadow:0 10px 30px rgba(255,79,154,.3)}
.btn-primary:hover{background:linear-gradient(135deg,var(--accent-2),var(--accent));filter:brightness(1.08)}
.btn:disabled,.btn.is-busy{opacity:.4;cursor:not-allowed;transform:none;pointer-events:none}

/* ---------- show ---------- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font-size:clamp(11px,1vw,14px);font-weight:700;letter-spacing:.12em;color:var(--fg-muted)}
.hud-brand{white-space:nowrap}
.hud-hint{color:var(--gold);text-align:center;transition:opacity .3s}
.hud-hint.is-hidden{visibility:hidden}
.hud-prog{text-align:right;font-variant-numeric:tabular-nums}
.q-head{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);flex-wrap:wrap}
.q-badge{flex:none;font-family:var(--font-display);font-size:clamp(20px,2.6vw,38px);line-height:1.25;color:var(--bg);background:var(--gold);padding:2px 14px;border-radius:12px}
.q-text{margin:0;min-width:0;font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.9vw,58px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,6),1fr);grid-auto-rows:minmax(0,1fr);gap:clamp(8px,1.1vw,16px)}
.card{position:relative;min-height:0;min-width:0;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-content:center;align-items:center;
  column-gap:clamp(8px,.9vw,14px);row-gap:clamp(6px,.9vh,12px);padding:clamp(8px,1.1vw,18px);border-radius:18px;background:var(--surface);border:1px solid var(--line);
  transition:transform .28s cubic-bezier(.2,.8,.2,1.3),background .2s,opacity .55s,box-shadow .3s,filter .55s,border-color .3s}
.avatar{width:clamp(34px,min(3.6vw,7vh),68px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-family:var(--font-display);font-size:clamp(13px,1.4vw,24px);
  background:hsl(var(--h) 72% 56%);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.name{min-width:0;font-weight:700;font-size:clamp(12px,1.15vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:clamp(22px,2.7vw,46px);line-height:1;min-width:1.1em;text-align:right;transition:color .3s}
.bar{grid-column:1 / -1;height:clamp(7px,.7vw,11px);border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .38s cubic-bezier(.2,.8,.2,1)}

.count.is-pop{animation:pop .38s cubic-bezier(.2,.8,.2,1.4)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5);color:var(--gold)}100%{transform:scale(1)}}
.card.is-hit{transform:scale(1.05);background:var(--surface-2);box-shadow:0 0 0 2px rgba(255,209,102,.65),0 12px 34px rgba(124,92,255,.35);z-index:1}
.plus{position:absolute;right:clamp(8px,1vw,16px);top:4px;font-family:var(--font-display);color:var(--gold);font-size:clamp(14px,1.5vw,24px);pointer-events:none;animation:rise .85s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}

.card.is-lose{opacity:.25;filter:grayscale(.65)}
.card.is-win{transform:scale(1.08);z-index:2;border-color:var(--gold);background:linear-gradient(135deg,rgba(255,209,102,.24),rgba(255,79,154,.18));
  animation:winpulse 1.5s ease-in-out infinite}
.card.is-win .count{color:var(--gold)}
.card.is-win .bar i{background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.card.is-win::after{content:'👑';position:absolute;top:-4px;left:-4px;font-size:clamp(18px,2vw,32px);transform:rotate(-16deg);filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
@keyframes winpulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 18px 50px rgba(255,209,102,.3)}50%{box-shadow:0 0 0 4px var(--gold),0 22px 70px rgba(255,209,102,.6)}}

.result{min-height:clamp(66px,11vh,114px);display:grid;place-items:center}
.result-inner{display:flex;flex-direction:column;align-items:center;gap:4px;padding:clamp(8px,1.2vh,14px) clamp(22px,3vw,44px);border-radius:22px;
  background:rgba(11,10,31,.86);border:1px solid var(--gold);box-shadow:0 18px 70px rgba(255,209,102,.3);backdrop-filter:blur(10px);
  opacity:0;transform:translateY(18px) scale(.9);transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1.25)}
.result.is-on .result-inner{opacity:1;transform:none}
.result.is-empty .result-inner{border-color:var(--line);box-shadow:none}
.result-label{color:var(--gold);font-weight:900;letter-spacing:.2em;font-size:clamp(11px,1vw,14px)}
.result-names{font-family:var(--font-display);font-size:clamp(26px,3.6vw,54px);line-height:1.1;text-align:center;text-wrap:balance;
  background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- controls / overlay / fx ---------- */
.ctrl{position:fixed;z-index:60;display:flex;gap:8px;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.ctrl-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(11,10,31,.7);color:var(--fg);cursor:pointer;font-size:16px;opacity:.5;transition:opacity .2s}
.ctrl-btn:hover{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,4,16,.72);backdrop-filter:blur(6px);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.panel{width:min(100%,560px);max-height:100%;overflow:auto;background:#141233;border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel-head strong{font-family:var(--font-display);font-weight:400;font-size:22px}
.st-status{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.5}
.st-block{display:flex;flex-direction:column;gap:8px}
.st-block label{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--fg-muted)}
.st-row{display:flex;gap:8px;flex-wrap:wrap}
.st-row input,.st-block textarea{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg)}
.st-block textarea{width:100%;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.st-note{margin:0;font-size:12px;color:var(--fg-muted);line-height:1.5}
.st-msg{margin:0;font-size:13px;line-height:1.5;color:var(--ok)}
.st-msg.is-err{color:var(--danger)}
.btn-sm{padding:10px 16px;font-size:14px}

@media (max-width:860px){
  .grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(64px,auto);overflow-y:auto;align-content:start;padding-bottom:4px}
  .hud{grid-template-columns:1fr auto}
  .hud-hint{grid-column:1 / -1;order:3;text-align:left}
  .card.is-win{transform:scale(1.03)}
}
@media (prefers-reduced-motion:reduce){
  .card,.bar i,.result-inner{transition:none}
  .count.is-pop,.card.is-win,.plus{animation:none}
}
</style>
</head>
<body>
<!-- INTRO -->
<section class="screen is-active" id="s-intro">
  <div class="intro">
    <p class="eyebrow">사전투표 결과 발표</p>
    <h1 class="title" id="title-main">우리끼리<br>어워즈</h1>
    <p class="lede" id="lede">여러분이 미리 보내주신 표를 지금부터 한 표씩 공개합니다.</p>
    <div class="row">
      <button class="btn btn-primary" id="btn-start" type="button">발표 시작</button>
    </div>
    <p class="keys" id="keys"><kbd>Space</kbd> 진행 · <kbd>←</kbd> 이전 · <kbd>R</kbd> 다시 · <kbd>F</kbd> 전체화면 · <kbd>M</kbd> 소리 · <kbd>H</kbd> 안내 숨김 · <kbd>S</kbd> 설정</p>
    <p class="data-status" id="data-status"><i></i><span id="data-status-text">결과 데이터 없음</span></p>
  </div>
</section>

<!-- SHOW -->
<section class="screen" id="s-show">
  <div class="hud">
    <span class="hud-brand" id="hud-brand">우리끼리 어워즈</span>
    <span class="hud-hint" id="hint">Space 또는 클릭으로 개표 시작</span>
    <span class="hud-prog" id="qprog">Q1 / 4</span>
  </div>
  <div class="q-head">
    <span class="q-badge" id="qbadge">Q1</span>
    <h2 class="q-text" id="qtext"></h2>
  </div>
  <div class="grid" id="grid"></div>
  <div class="result" id="result">
    <div class="result-inner">
      <span class="result-label" id="rlabel">WINNER</span>
      <span class="result-names" id="rnames"></span>
    </div>
  </div>
</section>

<!-- FINALE -->
<section class="screen" id="s-end">
  <div class="intro">
    <p class="eyebrow">모든 질문 공개 완료</p>
    <h1 class="title">오늘의<br>어워즈 끝</h1>
    <p class="lede">수고하셨습니다. Space 또는 클릭하면 처음 화면으로 돌아갑니다.</p>
    <div class="row"><button class="btn" id="btn-home" type="button">처음으로</button></div>
  </div>
</section>

<div class="ctrl">
  <button class="ctrl-btn" id="btn-sound" type="button" aria-label="소리 켜기/끄기">🔊</button>
  <button class="ctrl-btn" id="btn-fs" type="button" aria-label="전체화면">⛶</button>
  <button class="ctrl-btn" id="btn-settings" type="button" aria-label="설정">⚙</button>
</div>

<!-- SETTINGS (operator only) -->
<div class="overlay" id="settings" hidden>
  <div class="panel" role="dialog" aria-labelledby="settings-title">
    <div class="panel-head">
      <strong id="settings-title">결과 데이터</strong>
      <button class="btn btn-sm" id="st-close" type="button">닫기 (Esc)</button>
    </div>
    <p class="st-status" id="st-status"></p>

    <div class="st-block">
      <label for="st-key">시트에서 불러오기</label>
      <div class="st-row">
        <input id="st-key" type="password" autocomplete="off" placeholder="Code.gs의 ADMIN_KEY">
        <button class="btn btn-primary btn-sm" id="st-fetch" type="button">불러오기</button>
      </div>
      <p class="st-note" id="st-endpoint-note"></p>
    </div>

    <div class="st-block">
      <label for="st-json">또는 집계 JSON 붙여넣기</label>
      <textarea id="st-json" rows="4" placeholder='{"ok":true,"total":18,"questions":[{"index":1,"counts":{"3":7,"11":4}}]}'></textarea>
      <div class="st-row">
        <button class="btn btn-sm" id="st-apply" type="button">붙여넣은 결과 적용</button>
        <button class="btn btn-sm" id="st-sample" type="button">샘플 데이터로 리허설</button>
      </div>
    </div>

    <p class="st-msg" id="st-msg" hidden></p>
    <p class="st-note">불러온 결과는 이 브라우저에 저장되어 다음에 열 때도 유지됩니다. 행사 당일 인터넷 없이도 됩니다.</p>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script src="config.js"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const pad2 = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- 설정 ---------- */
  const CONFIG = window.AWARDS_CONFIG;
  if (!CONFIG || !Array.isArray(CONFIG.people) || !Array.isArray(CONFIG.questions)) {
    $('#lede').textContent = 'config.js를 찾지 못했어요. reveal.html과 같은 폴더에 config.js가 있어야 합니다.';
    $('#btn-start').disabled = true;
    return;
  }
  const PEOPLE = CONFIG.people.map((p, i) => Object.assign({ hue: Math.round((i * 137.508) % 360) }, p));
  const Q = CONFIG.questions;
  const N = Q.length;
  const TITLE = CONFIG.title || '우리끼리 어워즈';
  $('#hud-brand').textContent = TITLE;
  $('#title-main').innerHTML = esc(TITLE).replace(/\s+/, '<br>');
  const STORE_RESULTS = 'awards_results_v1', STORE_KEY = 'awards_admin_key', STORE_HINTS = 'awards_hints';
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  /* ---------- 결과 데이터 ---------- */
  // results = { source:'sample'|'sheet'|'paste', total:n, loadedAt:iso, counts:[{id:n},...] }  (counts[i] ↔ Q[i])
  let results = null;
  function sampleCounts(){
    const base = [{3:7,11:4,7:3,1:2,15:1,9:1},{5:6,12:5,2:3,17:2,8:2},{14:8,4:4,10:3,6:2,16:1},{2:5,13:5,7:4,18:2,1:2}];
    const ids = PEOPLE.map(p => p.id);
    let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const out = [];
    for (let i = 0; i < N; i++) {
      if (i < base.length && ids.length >= 18) { const c = {}; for (const k in base[i]) c[+k] = base[i][k]; out.push(c); continue; }
      const c = {}; const leader = ids[(rnd() * ids.length) | 0]; c[leader] = Math.ceil(ids.length * .35);
      let rest = ids.length - c[leader]; while (rest-- > 0) { const id = ids[(rnd() * ids.length) | 0]; c[id] = (c[id] || 0) + 1; }
      out.push(c);
    }
    return out;
  }
  function normalize(data, source){
    if (!data || !Array.isArray(data.questions)) throw new Error('questions 배열이 없습니다');
    const counts = [];
    for (let i = 0; i < N; i++) {
      const q = data.questions.find(x => Number(x.index) === i + 1) || data.questions[i];
      const c = {}; if (q && q.counts) for (const k in q.counts) { const n = Number(q.counts[k]); if (n > 0) c[+k] = n; }
      counts.push(c);
    }
    return { source, total: Number(data.total) || 0, loadedAt: new Date().toISOString(), counts };
  }
  function setResults(r, persist){
    results = r;
    if (persist) lsSet(STORE_RESULTS, JSON.stringify(r));
    renderStatus();
  }
  function fmtTime(iso){ const d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function statusText(){
    if (!results) return '결과 데이터 없음 · S 키로 불러오기';
    if (results.source === 'sample') return '샘플 데이터 (리허설용)';
    const src = results.source === 'sheet' ? '시트 결과' : '붙여넣은 결과';
    return src + ' · ' + results.total + '명 제출 · ' + fmtTime(results.loadedAt) + ' 불러옴';
  }
  function renderStatus(){
    const el = $('#data-status');
    el.classList.toggle('is-live', !!results && results.source !== 'sample');
    el.classList.toggle('is-sample', !!results && results.source === 'sample');
    $('#data-status-text').textContent = statusText();
    $('#st-status').textContent = statusText();
    $('#btn-start').disabled = !results;
  }
  (function restore(){
    try { const saved = JSON.parse(lsGet(STORE_RESULTS) || 'null'); if (saved && Array.isArray(saved.counts)) { results = saved; } } catch (e) {}
    // 저장된 결과가 없으면 샘플로 시작 (저장하지 않음). 첫 화면의 노란 점 = 샘플 데이터라는 표시.
    if (!results) results = { source: 'sample', total: PEOPLE.length, loadedAt: new Date().toISOString(), counts: sampleCounts() };
    const k = lsGet(STORE_KEY); if (k) $('#st-key').value = k;
    $('#st-endpoint-note').textContent = CONFIG.endpoint ? 'config.js의 endpoint로 요청합니다.' : 'config.js의 endpoint가 비어 있어 시트에서 불러올 수 없습니다. JSON 붙여넣기나 샘플을 쓰세요.';
    $('#st-fetch').disabled = !CONFIG.endpoint;
    renderStatus();
  })();

  /* ---------- 설정 패널 ---------- */
  const settings = $('#settings');
  let settingsOpen = false;
  function openSettings(){ settingsOpen = true; settings.hidden = false; $('#st-msg').hidden = true; setTimeout(() => $('#st-key').focus(), 0); }
  function closeSettings(){ settingsOpen = false; settings.hidden = true; }
  function stMsg(text, isErr){ const m = $('#st-msg'); m.textContent = text; m.hidden = false; m.classList.toggle('is-err', !!isErr); }
  $('#st-close').addEventListener('click', closeSettings);
  settings.addEventListener('click', e => { if (e.target === settings) closeSettings(); });
  $('#st-fetch').addEventListener('click', async () => {
    const key = $('#st-key').value.trim();
    if (!key) { stMsg('ADMIN_KEY를 입력하세요.', true); return; }
    const btn = $('#st-fetch'); btn.classList.add('is-busy'); btn.textContent = '불러오는 중…';
    try {
      const sep = CONFIG.endpoint.includes('?') ? '&' : '?';
      const r = await fetch(CONFIG.endpoint + sep + 'key=' + encodeURIComponent(key));
      const data = await r.json();
      if (!data.ok) throw new Error(data.error === 'forbidden' ? 'ADMIN_KEY가 틀렸습니다' : (data.error || '응답 오류'));
      lsSet(STORE_KEY, key);
      setResults(normalize(data, 'sheet'), true);
      stMsg(data.total + '명의 제출을 불러왔습니다.' + (data.total < PEOPLE.length ? ' (미제출 ' + (PEOPLE.length - data.total) + '명)' : ''));
    } catch (e) {
      stMsg('불러오지 못했습니다: ' + e.message, true);
    } finally { btn.classList.remove('is-busy'); btn.textContent = '불러오기'; }
  });
  $('#st-apply').addEventListener('click', () => {
    try { const data = JSON.parse($('#st-json').value); setResults(normalize(data, 'paste'), true); stMsg('붙여넣은 결과를 적용했습니다.'); }
    catch (e) { stMsg('JSON을 읽지 못했습니다: ' + e.message, true); }
  });
  $('#st-sample').addEventListener('click', () => {
    setResults({ source: 'sample', total: PEOPLE.length, loadedAt: new Date().toISOString(), counts: sampleCounts() }, true);
    stMsg('샘플 데이터로 전환했습니다. 실제 발표 전에 시트 결과를 다시 불러오세요.');
  });

  /* ---------- 소리 ---------- */
  let AC = null, soundOn = true;
  function audio(){
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol){
    if (!soundOn) return;
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  }
  const tick = n => tone(440 + n * 38, .07, 'square', .045);
  const thump = () => tone(110, .25, 'sine', .14);
  const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .4, 'triangle', .12), i * 110));

  /* ---------- 폭죽 ---------- */
  const fx = $('#fx'), fc = fx.getContext('2d');
  const COLORS = ['#ff4f9a', '#7c5cff', '#ffd166', '#4de1c1', '#ffffff', '#ff8a5c'];
  let parts = [], raf = null;
  function resize(){ const dpr = window.devicePixelRatio || 1; fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fc.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener('resize', resize); resize();
  function push(x, y, vx, vy){
    parts.push({ x, y, vx, vy, r: 4 + Math.random() * 5, c: COLORS[(Math.random() * COLORS.length) | 0],
      rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 1, decay: .005 + Math.random() * .008, shape: (Math.random() * 3) | 0 });
  }
  function burst(x, y, n, speed){ for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = speed * (.3 + Math.random() * .9); push(x, y, Math.cos(a) * s, Math.sin(a) * s); } loop(); }
  function cannon(x, y, angle, n){ for (let i = 0; i < n; i++) { const a = angle + (Math.random() - .5) * .9, s = 10 + Math.random() * 10; push(x, y, Math.cos(a) * s, Math.sin(a) * s); } loop(); }
  function loop(){ if (!raf) raf = requestAnimationFrame(frame); }
  function frame(){
    fc.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += .22; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      fc.save(); fc.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); fc.translate(p.x, p.y); fc.rotate(p.rot); fc.fillStyle = p.c;
      if (p.shape === 0) fc.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2);
      else if (p.shape === 1) { fc.beginPath(); fc.arc(0, 0, p.r * .7, 0, 7); fc.fill(); }
      else { fc.beginPath(); fc.moveTo(0, -p.r); fc.lineTo(p.r, p.r); fc.lineTo(-p.r, p.r); fc.closePath(); fc.fill(); }
      fc.restore();
    }
    if (parts.length) raf = requestAnimationFrame(frame);
    else { raf = null; fc.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function celebrate(big){
    const W = innerWidth, H = innerHeight, n = big ? 150 : 100;
    cannon(0, H, -Math.PI / 4, n); cannon(W, H, -3 * Math.PI / 4, n);
    [0, 350, 750, 1150].forEach(t => setTimeout(() => burst(W * (.2 + Math.random() * .6), H * (.15 + Math.random() * .35), big ? 90 : 60, 9), t));
  }

  /* ---------- 발표 흐름 ---------- */
  let qi = 0, phase = 'intro', counts = {}, ballots = [], timer = null, fast = false;
  const grid = $('#grid'), result = $('#result'), hint = $('#hint');
  // 인원수에 맞춰 열 수 결정: 빈 칸이 가장 적은 열 수 (18명→6×3, 20명→5×4, 16명→4×4)
  (function(){ let best = 6, bestEmpty = Infinity; for (const c of [7, 6, 5, 4]) { const empty = Math.ceil(PEOPLE.length / c) * c - PEOPLE.length; if (empty < bestEmpty) { bestEmpty = empty; best = c; } } grid.style.setProperty('--cols', best); })();
  function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('is-active', s.id === id)); }
  function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function avatarHTML(p){
    const inner = p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : pad2(p.id);
    return '<div class="avatar" style="--h:' + p.hue + '">' + inner + '</div>';
  }
  function cardHTML(p){
    return '<div class="card" data-id="' + p.id + '">' + avatarHTML(p) +
      '<div class="name">' + esc(p.name) + '</div><div class="count">0</div><div class="bar"><i></i></div></div>';
  }
  function loadQuestion(){
    clearTimeout(timer);
    counts = {}; PEOPLE.forEach(p => counts[p.id] = 0);
    $('#qbadge').textContent = 'Q' + (qi + 1);
    $('#qprog').textContent = 'Q' + (qi + 1) + ' / ' + N;
    $('#qtext').textContent = Q[qi];
    grid.innerHTML = PEOPLE.map(cardHTML).join('');
    result.classList.remove('is-on', 'is-empty');
    hint.textContent = 'Space 또는 클릭으로 개표 시작';
    phase = 'ready'; fast = false;
    showScreen('s-show');
  }
  function startCount(){
    const src = (results && results.counts[qi]) || {};
    ballots = [];
    for (const id in src) for (let i = 0; i < src[id]; i++) ballots.push(+id);
    shuffle(ballots);
    phase = 'counting'; fast = false;
    hint.textContent = ballots.length ? '개표 중 · Space로 빨리 감기' : '';
    step();
  }
  function step(){
    if (!ballots.length) { timer = setTimeout(finish, 850); return; }
    const id = ballots.shift();
    counts[id] = (counts[id] || 0) + 1;
    const max = Math.max(1, ...Object.values(counts));
    grid.querySelectorAll('.card').forEach(c => { c.querySelector('.bar i').style.width = ((counts[c.dataset.id] || 0) / max * 100) + '%'; });
    const card = grid.querySelector('.card[data-id="' + id + '"]');
    if (card) {
      const cnt = card.querySelector('.count');
      cnt.textContent = counts[id];
      cnt.classList.remove('is-pop'); void cnt.offsetWidth; cnt.classList.add('is-pop');
      card.classList.add('is-hit'); setTimeout(() => card.classList.remove('is-hit'), 320);
      const plus = document.createElement('span'); plus.className = 'plus'; plus.textContent = '+1';
      card.appendChild(plus); setTimeout(() => plus.remove(), 850);
    }
    const left = ballots.length;
    if (left < 4 && !fast) thump(); else tick(counts[id]);
    timer = setTimeout(step, fast ? 45 : (left < 4 ? 700 : 240));
  }
  function finish(){
    const max = Math.max(0, ...Object.values(counts));
    phase = 'done';
    hint.textContent = qi < N - 1 ? 'Space로 다음 질문 · R 다시 보기' : 'Space로 마무리';
    if (max === 0) {
      $('#rlabel').textContent = '집계된 표 없음';
      $('#rnames').textContent = '이 질문은 아직 표가 없어요';
      result.classList.add('is-on', 'is-empty');
      return;
    }
    const winners = PEOPLE.filter(p => counts[p.id] === max);
    grid.querySelectorAll('.card').forEach(c => c.classList.add(counts[c.dataset.id] === max ? 'is-win' : 'is-lose'));
    $('#rlabel').textContent = (winners.length > 1 ? '공동 1위 · ' : 'WINNER · ') + max + '표';
    $('#rnames').textContent = winners.map(w => w.name).join(' & ');
    result.classList.add('is-on');
    fanfare(); celebrate(winners.length > 1);
  }
  function advance(){
    if (phase === 'intro') { if (!results) { openSettings(); return; } qi = 0; loadQuestion(); }
    else if (phase === 'ready') startCount();
    else if (phase === 'counting') fast = true;
    else if (phase === 'done') {
      if (qi < N - 1) { qi++; loadQuestion(); }
      else { phase = 'end'; showScreen('s-end'); celebrate(true); setTimeout(() => celebrate(true), 900); }
    }
    else if (phase === 'end') goHome();
  }
  function goHome(){ clearTimeout(timer); phase = 'intro'; showScreen('s-intro'); }
  function back(){
    if (phase === 'intro') return;
    if (phase === 'end') { qi = N - 1; loadQuestion(); return; }
    if (qi === 0) { goHome(); return; }
    qi--; loadQuestion();
  }
  function toggleFS(){
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } catch (e) {}
  }
  function toggleSound(){ soundOn = !soundOn; $('#btn-sound').textContent = soundOn ? '🔊' : '🔇'; }
  let hintsOn = lsGet(STORE_HINTS) !== 'off';
  function applyHints(){ hint.classList.toggle('is-hidden', !hintsOn); $('#keys').classList.toggle('is-hidden', !hintsOn); }
  function toggleHints(){ hintsOn = !hintsOn; lsSet(STORE_HINTS, hintsOn ? 'on' : 'off'); applyHints(); }
  applyHints();

  /* ---------- 입력 ---------- */
  $('#btn-start').addEventListener('click', e => { e.stopPropagation(); audio(); advance(); });
  $('#btn-home').addEventListener('click', e => { e.stopPropagation(); goHome(); });
  $('#btn-sound').addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
  $('#btn-fs').addEventListener('click', e => { e.stopPropagation(); toggleFS(); });
  $('#btn-settings').addEventListener('click', e => { e.stopPropagation(); settingsOpen ? closeSettings() : openSettings(); });
  $('#s-show').addEventListener('click', () => { audio(); advance(); });
  $('#s-end').addEventListener('click', () => advance());
  addEventListener('keydown', e => {
    if (settingsOpen) { if (e.key === 'Escape') closeSettings(); return; }
    if (e.code === 'Space' || e.key === 'ArrowRight') { e.preventDefault(); audio(); advance(); }
    else if (e.key === 'ArrowLeft') back();
    else if (e.key === 'r' || e.key === 'R') { if (phase === 'counting' || phase === 'done') loadQuestion(); }
    else if (e.key === 'f' || e.key === 'F') toggleFS();
    else if (e.key === 'm' || e.key === 'M') toggleSound();
    else if (e.key === 'h' || e.key === 'H') toggleHints();
    else if (e.key === 's' || e.key === 'S') openSettings();
  });
})();
</script>
</body>
</html>
